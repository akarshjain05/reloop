AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  ReLoop (hackathon demo). HTTP API + Lambda running the FastAPI app, DynamoDB, S3 (uploads + frontend),
  CloudFront, Cognito (sign-in + role groups). AI runs on Amazon Bedrock (see BedrockRegion/BedrockModelId).
  Sized for demo traffic. Delete with `sam delete` (empty both S3 buckets first).

Parameters:
  Stage:
    Type: String
    Default: demo
    AllowedPattern: "^[a-z0-9-]{2,12}$"
    Description: Short name used in resource names.
  BedrockRegion:
    Type: String
    Default: us-east-1
    Description: Region where the Bedrock model below is enabled for your account. It can differ from the stack region.
  BedrockModelId:
    Type: String
    Default: us.amazon.nova-lite-v1:0
    Description: Multimodal (image input) Bedrock model or inference-profile id that supports the Converse API and tool use.
  DemoMode:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: true enables demo accounts on the sign-in page and the demo fast-forward button. Set false for anything real.
  DemoPassword:
    Type: String
    NoEcho: true
    Default: "ReLoop#Demo1"
    MinLength: 8
    Description: Password shown for the demo accounts (also used by scripts/seed_demo.py). Demo data only.
  ExtraCorsOrigins:
    Type: String
    Default: "http://localhost:5173"
    Description: Extra comma-separated browser origins allowed by CORS (for local frontend development). The CloudFront site is added automatically.

Resources:
  # ---------------------------------------------------------------- Authentication: Amazon Cognito
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "reloop-${Stage}"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: reloop-web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      ReadAttributes: [email, email_verified, name]
      WriteAttributes: [email, name]

  # Roles = Cognito groups; the API reads `cognito:groups` from the ID token.
  GroupUser:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {UserPoolId: !Ref UserPool, GroupName: USER, Description: Residents and students}
  GroupCollector:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {UserPoolId: !Ref UserPool, GroupName: COLLECTOR, Description: Pickup collectors}
  GroupAdmin:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {UserPoolId: !Ref UserPool, GroupName: ADMIN, Description: Platform administrators}
  GroupOrgAdmin:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {UserPoolId: !Ref UserPool, GroupName: ORGANIZATION_ADMIN, Description: "Campus, society and office admins"}

  # ---------------------------------------------------------------- Data: DynamoDB (single table) and S3 (images)
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "reloop-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
        - {AttributeName: gsi1pk, AttributeType: S}
        - {AttributeName: gsi1sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - {AttributeName: gsi1pk, KeyType: HASH}
            - {AttributeName: gsi1sk, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
      SSESpecification: {SSEEnabled: true}

  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - {Id: expire-demo-uploads, Status: Enabled, Prefix: uploads/, ExpirationInDays: 30}

  # ---------------------------------------------------------------- Frontend: S3 (private) + CloudFront
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}

  FrontendOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "reloop-${Stage}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "ReLoop ${Stage} frontend"
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOac.Id
            S3OriginConfig: {OriginAccessIdentity: ""}
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
        CustomErrorResponses:  # single-page app: unknown paths fall back to index.html
          - {ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0}
          - {ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0}

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ---------------------------------------------------------------- API: API Gateway (HTTP API) + Lambda (FastAPI via Mangum)
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/reloop-${Stage}-api"
      RetentionInDays: 14

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: !Sub "ReLoop ${Stage} API"
      DefaultRouteSettings:  # cheap abuse protection on top of the in-app rate limits
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
    Properties:
      FunctionName: !Sub "reloop-${Stage}-api"
      Description: ReLoop FastAPI app behind API Gateway
      CodeUri: ../backend/
      Handler: app.lambda_handler.handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 1024
      Timeout: 29
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          APP_ENV: production
          DEMO_MODE: !Ref DemoMode
          DEMO_PASSWORD: !Ref DemoPassword
          DYNAMODB_TABLE: !Ref Table
          S3_BUCKET: !Ref UploadsBucket
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_REGION: !Ref BedrockRegion
          SEED_ON_START: "false"
          CORS_ORIGINS: !Sub "https://${Distribution.DomainName},${ExtraCorsOrigins}"
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
        - S3CrudPolicy: {BucketName: !Ref UploadsBucket}
        - Version: "2012-10-17"
          Statement:
            - Sid: InvokeBedrockModels
              Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*"
            - Sid: ManageUsersInThisPoolOnly
              Effect: Allow
              Action: [cognito-idp:AdminCreateUser, cognito-idp:AdminSetUserPassword, cognito-idp:AdminAddUserToGroup, cognito-idp:AdminGetUser]
              Resource: !GetAtt UserPool.Arn
      Events:
        Proxy:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: "/{proxy+}", Method: ANY}
        Root:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /, Method: ANY}

Outputs:
  ApiUrl:
    Description: API base URL. Use it as VITE_API_BASE_URL when building the frontend.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  FrontendUrl:
    Description: The deployed website (CloudFront).
    Value: !Sub "https://${Distribution.DomainName}"
  FrontendBucketName:
    Value: !Ref FrontendBucket
  DistributionId:
    Value: !Ref Distribution
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  TableName:
    Value: !Ref Table
  UploadsBucketName:
    Value: !Ref UploadsBucket
  FunctionName:
    Value: !Ref ApiFunction
  LogGroupName:
    Value: !Ref ApiLogGroup
