# ReLoop impact assumptions
# ---------------------------------------------------------------------------------------
# STATUS: ILLUSTRATIVE PLACEHOLDERS. These are configured assumptions, NOT measured or
# peer-reviewed values. Replace them with verified factors (and cite the source in
# docs/DATA_SOURCES.md) before making any public environmental claim.
# Laptop values (1.8 kg, 6.4 kg CO2e) come from the project brief; everything else is a
# rough placeholder chosen to be internally consistent.
# ---------------------------------------------------------------------------------------
version: "2026.09-demo"
status: illustrative
disclaimer: "Illustrative estimate based on configured assumptions — not a measured or certified figure."

categories:
  computing: Computers and components
  mobile: Phones and tablets
  displays: Monitors and TVs
  peripherals: Keyboards, mice, printers
  small_electronics: Small electronics
  power: Batteries and power banks
  network_storage: Routers and storage
  other: Other electronics

# Expected share of ITEMS by category in a typical campus/society (assumption).
# Used only for the "collection gap" analysis that drives campaign suggestions.
