# Local demo without installing Python or Node:  docker compose up
# Frontend: http://localhost:5173   API docs: http://localhost:8000/docs
# (Written for convenience; the author's sandbox had no Docker, so this file has not been run. The non-Docker path in the README has.)
services:
  backend:
    build: ./backend
    environment:
      DEMO_MODE: "true"
      CORS_ORIGINS: "http://localhost:5173"
      # Uncomment to use real AWS from a container (credentials come from your environment):
      # AI_PROVIDER: bedrock
      # BEDROCK_REGION: us-east-1
      # AWS_ACCESS_KEY_ID:
      # AWS_SECRET_ACCESS_KEY:
      # AWS_SESSION_TOKEN:
    ports: ["8000:8000"]
    volumes: ["reloop-data:/data"]
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://backend:8000
    ports: ["5173:5173"]
    volumes: ["./frontend:/app", "frontend-node-modules:/app/node_modules"]
    depends_on: [backend]
volumes:
  reloop-data:
  frontend-node-modules:
